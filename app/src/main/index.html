<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jam Masjid Digital</title><link rel="stylesheet" href="style.css"></head><body><main id="screen"><header><div id="mosque">MASJID</div><div id="date"></div></header><section class="clock" id="clock">00:00:00</section><section class="next"><small>MENUJU SALAT BERIKUTNYA</small><strong id="next">--</strong><div id="count">--:--:--</div></section><section class="times" id="times"></section><div class="ticker"><span id="text">Selamat datang</span></div></main><section id="admin" hidden><h1>Pengaturan Jam Masjid</h1><form id="form"><label>Nama Masjid<input id="mosqueInput"></label><label>Lokasi<input id="location"></label><label>Running Text<textarea id="message" rows="3"></textarea></label><h2>Jadwal Salat (format HH:MM)</h2><div class="grid" id="timeFields"></div><h2>Jeda Iqomah (menit)</h2><div class="grid" id="iqFields"></div><h2>Koreksi waktu (menit)</h2><div class="grid" id="offFields"></div><button type="submit">Simpan Pengaturan</button><p id="saved"></p><p>Panel ini bisa diakses dari browser perangkat lain yang terhubung Wi-Fi sama: http://IP-ANDROID:8080/admin</p></form></section><script src="app.js"></script></body></html>
